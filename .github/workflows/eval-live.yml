# Live evaluations against Azure, run by hand (Actions tab -> "Live evaluation" -> Run workflow).
# Signs in with OpenID Connect: no secrets stored, only IDs. One-time setup is in the README (Week 6).
name: Live evaluation

on:
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: azure-live          # the federated credential trusts this environment only
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
      AZURE_AI_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      AZURE_CHAT_DEPLOYMENT: ${{ vars.AZURE_CHAT_DEPLOYMENT }}
      AZURE_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_EMBEDDING_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Data (same seeds as the files already in Blob Storage)
        run: |
          python scripts/generate_synthetic_data.py
          python scripts/generate_adversarial_data.py

      - name: Extract resumes and requests with Content Understanding
        run: |
          python scripts/extract_resumes.py
          python scripts/extract_requirements.py

      - name: Evaluate extraction, search, agent, submissions
        run: |
          python scripts/evaluate_extraction.py
          python scripts/evaluate_search.py
          python scripts/evaluate_agent.py
          python scripts/evaluate_submissions.py

      - name: Foundry model-graded evaluators
        run: python scripts/evaluate_agent_foundry.py

      - name: Red-team the guardrails (live) + gates
        run: |
          python scripts/evaluate_guardrails.py --live
          python scripts/check_eval_gates.py docs/eval/guardrails_report.json

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-eval-reports
          path: docs/eval/
